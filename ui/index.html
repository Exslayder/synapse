<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synapse</title>
<style>
  :root{
    --bg:#0b0e13; --bg-2:#0f1319; --panel:#141922; --panel-2:#191f2a; --line:#232b38;
    --text:#e8edf5; --muted:#8a97a9; --faint:#5d6a7c;
    --accent:#4c8dff; --accent-2:#8b5cf6; --ok:#34c98a; --warn:#f2b544; --err:#ef5f5f;
    --radius:18px; --shadow:0 18px 40px -18px rgba(0,0,0,.8);
    --glow:0 0 0 1px rgba(255,255,255,.04);
  }
  html[data-theme="light"]{
    --bg:#eef1f6; --bg-2:#e6eaf1; --panel:#fff; --panel-2:#f7f9fc; --line:#dde3ec;
    --text:#141a22; --muted:#5f6b7c; --faint:#8b96a6;
    --shadow:0 18px 40px -22px rgba(20,30,50,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--text);font:14px/1.5 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    background:
      radial-gradient(1100px 520px at 12% -12%, rgba(76,141,255,.18), transparent 62%),
      radial-gradient(900px 480px at 96% -6%, rgba(139,92,246,.16), transparent 60%),
      linear-gradient(180deg,var(--bg-2),var(--bg));
    overflow:hidden; -webkit-font-smoothing:antialiased;
  }
  .app{height:100%;display:flex;flex-direction:column;gap:clamp(14px,2.2vh,24px);
    padding:clamp(18px,3vh,30px) clamp(20px,3vw,34px)}

  header{display:flex;align-items:center;gap:14px;flex:0 0 auto}
  .logo{width:clamp(40px,4.6vh,48px);aspect-ratio:1;border-radius:15px;
    background:linear-gradient(150deg,#4c8dff,#8b5cf6 65%,#b45cf0);
    display:grid;place-items:center;box-shadow:0 12px 28px -12px rgba(76,141,255,.85),var(--glow);flex:0 0 auto}
  .logo svg{width:60%;height:60%;display:block}
  .brand{min-width:0}
  .brand .name{font-size:clamp(17px,2.2vh,20px);font-weight:650;letter-spacing:.2px}
  .brand .tag{font-size:12.5px;color:var(--muted);margin-top:1px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .spacer{flex:1}
  .icon-btn{width:clamp(34px,4.2vh,40px);aspect-ratio:1;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:.16s}
  .icon-btn:hover{color:var(--text);border-color:#33415a;transform:translateY(-1px)}
  .icon-btn svg{width:17px;height:17px}

  .status{display:grid;gap:12px;grid-template-columns:repeat(4,minmax(0,1fr));flex:0 0 auto}
  @media (max-width:1000px){ .status{grid-template-columns:repeat(2,minmax(0,1fr))} }
  @media (max-width:560px){ .status{grid-template-columns:1fr} }
  .stat{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);
    border-radius:14px;padding:clamp(10px,1.6vh,14px) 15px}
  .stat .k{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:10.5px;
    letter-spacing:.7px;text-transform:uppercase;font-weight:600}
  .stat .k svg{width:12px;height:12px}
  .stat .v{margin-top:5px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px rgba(52,201,138,.16);flex:0 0 auto}
  .dot.warn{background:var(--warn);box-shadow:0 0 0 3px rgba(242,181,68,.16)}
  .dot.idle{background:var(--faint);box-shadow:none}

  .sec-head{display:flex;align-items:center;gap:10px;flex:0 0 auto}
  .sec-head h2{margin:0;font-size:15px;letter-spacing:.2px;color:var(--text);font-weight:700;
    position:relative;cursor:help;outline:none}
  .sec-head h2::after{content:attr(data-tip);position:absolute;left:0;top:calc(100% + 9px);
    width:max-content;max-width:280px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
    background:var(--panel-2);color:var(--muted);font-size:11.5px;font-weight:500;line-height:1.4;
    box-shadow:var(--shadow);opacity:0;transform:translateY(-4px);pointer-events:none;
    transition:opacity .15s ease,transform .15s ease;z-index:5}
  .sec-head h2:hover::after,.sec-head h2:focus-visible::after{opacity:1;transform:none}
  .sec-head .line{height:1px;flex:1;background:linear-gradient(90deg,var(--line),transparent)}
  .sec-head .count{font-size:11px;color:var(--faint)}
  .sites-head{display:flex;flex-direction:column;flex:0 0 auto}
  .edit-bar{display:flex;align-items:center;flex-wrap:wrap;gap:8px;flex:0 0 auto;
    max-height:0;margin-top:0;opacity:0;overflow:hidden;transform:translateY(-6px);pointer-events:none;
    transition:max-height .28s cubic-bezier(.2,.8,.2,1),margin-top .28s cubic-bezier(.2,.8,.2,1),opacity .2s ease,transform .25s ease}
  .edit-bar.open{max-height:80px;margin-top:10px;opacity:1;transform:none;pointer-events:auto}
  .edit-bar.open.ready{overflow:visible}
  .edit-bar .spacer{flex:1;min-width:8px}
  .edit-toggle{display:inline-flex;align-items:center;gap:7px;border:1px solid rgba(76,141,255,.38);
    background:linear-gradient(180deg,rgba(76,141,255,.16),rgba(76,141,255,.06));
    color:#bfd5ff;border-radius:10px;padding:7px 13px;font-family:"Segoe UI Variable Display","Segoe UI Variable Text",system-ui,sans-serif;
    font-size:12.5px;font-weight:600;letter-spacing:.1px;cursor:pointer;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.06);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease}
  .edit-toggle:hover{transform:translateY(-1px);border-color:rgba(76,141,255,.7);
    box-shadow:0 9px 22px -11px rgba(76,141,255,.95),inset 0 1px 0 rgba(255,255,255,.09)}
  .edit-toggle:active{transform:translateY(0) scale(.97)}
  .edit-toggle[hidden]{display:none}
  .edit-toggle svg{width:14px;height:14px;opacity:.9}
  .edit-btn{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:8px 13px;
    font-family:"Segoe UI Variable Display","Segoe UI Variable Text",system-ui,sans-serif;
    font-size:12.5px;font-weight:600;letter-spacing:.1px;cursor:pointer;border:1px solid transparent;
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease,color .18s ease,filter .18s ease}
  .edit-btn svg{width:14px;height:14px}
  .edit-btn:hover{transform:translateY(-1px)}
  .edit-btn:active{transform:translateY(0) scale(.97)}
  .edit-btn:focus-visible,.edit-toggle:focus-visible{outline:2px solid rgba(76,141,255,.75);outline-offset:2px}
  .edit-btn.add{background:rgba(76,141,255,.12);border-color:rgba(76,141,255,.34);color:#a9c8ff}
  .edit-btn.add:hover{background:rgba(76,141,255,.2);border-color:rgba(76,141,255,.6);
    box-shadow:0 8px 20px -12px rgba(76,141,255,.9)}
  .edit-btn.cancel{background:transparent;border-color:var(--line);color:var(--muted)}
  .edit-btn.cancel:hover{color:var(--text);border-color:#3a4a63;background:rgba(255,255,255,.04)}
  .edit-btn.save{background:linear-gradient(135deg,#4c8dff,#8b5cf6);color:#fff;
    box-shadow:0 10px 24px -12px rgba(76,141,255,.95)}
  .edit-btn.save:hover{filter:brightness(1.09);box-shadow:0 14px 28px -12px rgba(76,141,255,1)}
  html[data-theme="light"] .edit-toggle{color:#2f5fb3;background:rgba(76,141,255,.09)}
  html[data-theme="light"] .edit-btn.add{color:#2f5fb3}
  @keyframes editIn{from{opacity:.55;transform:translateY(4px)}to{opacity:1;transform:none}}
  .editing-card{animation:editIn .22s ease both}
  .card.editing-card .body{flex:1;min-width:0}
  .edit-fields{display:flex;flex-direction:column;gap:7px;flex:1;min-width:0}
  .edit-fields input{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;
    color:var(--text);font:inherit;font-size:13px;padding:7px 10px;outline:none;transition:.15s}
  .edit-fields input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(76,141,255,.14)}
  .edit-fields input.invalid{border-color:var(--err);box-shadow:0 0 0 3px rgba(239,95,95,.15)}
  .delete-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;
    color:var(--faint);cursor:pointer;font-size:17px;line-height:1;flex:0 0 auto;transition:.15s}
  .delete-btn:hover{color:var(--err);border-color:rgba(239,95,95,.45)}
  .card.editing-card .actions{display:none}

  .sites{flex:1 1 auto;min-height:0;display:grid;gap:12px;align-content:start;
    grid-template-columns:1fr;overflow:auto;scrollbar-width:none;padding:6px 2px 6px 0}
  .sites::-webkit-scrollbar{display:none}
  .card{display:flex;align-items:center;gap:14px;padding:clamp(12px,1.8vh,16px);border-radius:var(--radius);
    background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);
    box-shadow:var(--shadow);transition:transform .16s,border-color .16s}
  .card:hover{transform:translateY(-2px);border-color:#33415a}
  .tile{width:clamp(44px,5.6vh,52px);aspect-ratio:1;border-radius:14px;display:grid;place-items:center;flex:0 0 auto;
    background:#0d1219;border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
  html[data-theme="light"] .tile{background:#fff;border-color:#e3e9f2}
  .tile::before{content:"";position:absolute;inset:-30%;background:radial-gradient(circle at 30% 20%,var(--tint),transparent 65%);filter:blur(6px)}
  .tile svg{width:54%;height:54%;position:relative;z-index:1}
  .card .body{flex:1;min-width:0}
  .card .name{font-weight:640;font-size:15px;display:flex;align-items:center;gap:8px}
  .card .host{color:var(--faint);font-size:12px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .host b{color:var(--muted);font-weight:500}
  .pin{color:var(--warn);display:inline-flex}
  .pin svg{width:12px;height:12px}
  .actions{display:flex;align-items:center;gap:8px}
  .btn{border:0;border-radius:11px;padding:9px 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;
    color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-2));
    box-shadow:0 8px 20px -10px rgba(76,141,255,.9);transition:.16s}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
  .btn.open{background:linear-gradient(135deg,#2f9e6e,#34c98a);
    box-shadow:0 8px 20px -10px rgba(52,201,138,.9)}
  .drag-handle{width:16px;display:none;place-items:center;color:var(--faint);cursor:grab;flex:0 0 auto}
  body.editing .drag-handle{display:grid}
  .drag-handle:active{cursor:grabbing}
  .drag-handle svg{width:14px;height:14px}
  body.editing .card{border-style:dashed;border-color:#33415a}
  .card.dragging{opacity:.6;border-color:#3a4a63;transform:none}
  body.dragging-active{cursor:grabbing;user-select:none}
  .mini-btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:9px;
    padding:5px 11px;font:inherit;font-size:11.5px;cursor:pointer;transition:.15s}
  .mini-btn:hover{color:var(--text);border-color:#33415a}
  .mini-btn.active{color:var(--accent);border-color:rgba(76,141,255,.45);background:rgba(76,141,255,.1)}
  .more{width:30px;height:30px;border-radius:9px;border:1px solid transparent;background:transparent;
    color:var(--faint);cursor:pointer;font-size:15px;line-height:1}
  .more:hover{color:var(--text);background:var(--panel);border-color:var(--line)}
  .pin-btn{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;
    color:var(--faint);cursor:pointer;display:grid;place-items:center;transition:.15s}
  .pin-btn svg{width:15px;height:15px}
  .pin-btn:hover{color:var(--text);background:var(--panel);border-color:var(--line)}
  .pin-btn.active{color:var(--warn);background:rgba(242,181,68,.1);border-color:rgba(242,181,68,.35)}
  .globe-btn{width:32px;height:32px;border-radius:9px;border:1px solid transparent;background:transparent;
    color:var(--faint);cursor:pointer;display:grid;place-items:center;transition:.15s}
  .globe-btn svg{width:15px;height:15px}
  .globe-btn:hover{color:var(--text);background:var(--panel);border-color:var(--line)}
  .globe-btn.active{color:#7fb3ff;background:rgba(76,141,255,.12);border-color:rgba(76,141,255,.35)}
  .hs{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto;margin-right:7px}
  .hs.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(52,201,138,.16)}
  .hs.bad{background:var(--err);box-shadow:0 0 0 3px rgba(239,95,95,.16)}

  .toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#1d2632;border:1px solid var(--line);color:var(--text);font-size:12.5px;
    padding:9px 14px;border-radius:10px;transition:.2s;max-width:80vw}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.ok{border-color:rgba(52,201,138,.35);color:#8ef0bd}
  .toast.err{border-color:rgba(239,95,95,.35);color:#ffb3b3}

  .update{display:flex;flex-wrap:wrap;align-items:center;gap:12px 14px;padding:12px 14px;border-radius:14px;flex:0 0 auto;
    border:1px solid rgba(76,141,255,.38);background:linear-gradient(120deg,rgba(76,141,255,.16),rgba(139,92,246,.14));
    box-shadow:0 14px 32px -20px rgba(76,141,255,.95)}
  .update[hidden]{display:none}
  .update .badge{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;flex:0 0 auto;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
    box-shadow:0 8px 18px -10px rgba(76,141,255,.9)}
  .update .badge svg{width:18px;height:18px}
  .update .txt{flex:1 1 220px;min-width:0}
  .update .txt .t{font-weight:640;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .update .txt .s{color:var(--muted);font-size:12px;margin-top:2px;display:-webkit-box;
    -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .update .acts{display:flex;align-items:center;gap:10px;flex:0 0 auto;margin-left:auto}
  .update a.link{color:#9dc0ff;font-size:12px;text-decoration:none;border-bottom:1px dashed rgba(157,192,255,.5)}
  .update a.link:hover{color:#cfe0ff}
  .update .dismiss{width:28px;height:28px;border:0;background:transparent;color:var(--muted);font-size:18px;
    line-height:1;cursor:pointer;border-radius:8px}
  .update .dismiss:hover{color:var(--text);background:rgba(255,255,255,.07)}
  .update .dismiss:disabled{opacity:.4;cursor:default}
  .update .btn{padding:8px 16px}

  @media (max-width:820px){
    .card .more{display:none}
    .card .host{font-size:11.5px}
  }
  @media (max-width:700px){
    .brand .tag{white-space:normal;overflow:visible;text-overflow:clip}
  }
  @media (max-width:640px){
    .update .acts{flex:1 1 100%;justify-content:flex-end}
  }
  @media (max-height:620px){
    .status{display:none}
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2.5 12h3.2l2.1-6.2 3.2 12.4 2.6-8.1 1.7 3.2h6.2"/>
      </svg>
    </div>
    <div class="brand">
      <div class="name">Synapse</div>
      <div class="tag">Доступ к любой ИИ — в одном окне, через свой DoH или VPN</div>
    </div>
    <div class="spacer"></div>
    <button class="icon-btn" id="refresh" title="Обновить состояние">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>
    </button>
    <button class="icon-btn" title="Журнал" onclick="location.href='logs.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z"/><path d="M7 9h6M7 13h10M7 16h4"/></svg>
    </button>
    <button class="icon-btn" title="Настройки" onclick="location.href='settings.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
    </button>
  </header>

  <div class="update" id="update" hidden>
    <div class="badge" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 4v10"/><path d="m7.5 9.5 4.5 4.5 4.5-4.5"/><path d="M5 18h14"/>
      </svg>
    </div>
    <div class="txt">
      <div class="t">Доступно обновление <span id="updateVersion">—</span></div>
      <div class="s" id="updateNote">—</div>
    </div>
    <div class="acts">
      <a class="link" id="updateNotesLink" href="#" hidden>Что нового</a>
      <button class="btn" id="updateNow">Обновить</button>
      <button class="dismiss" id="updateHide" title="Скрыть до следующего запуска">×</button>
    </div>
  </div>

  <section class="status">
    <div class="stat" title="Локальный прокси, через который браузеры Synapse резолвят адреса по DoH">
      <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h16M12 4v16"/></svg>Локальный прокси</div>
      <div class="v"><span class="dot idle" id="proxyDot"></span><span id="proxyValue">—</span></div>
    </div>
    <div class="stat" title="Как Synapse выходит в интернет: DoH, VPN или системный DNS">
      <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/></svg>Подключение</div>
      <div class="v"><span class="dot warn" id="dohDot"></span><span id="dohValue">Не выбран</span></div>
    </div>
    <div class="stat" title="Сколько сайтов сейчас открыто в отдельных окнах браузера">
      <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M3 8h18"/></svg>Открыто окон</div>
      <div class="v"><span class="dot idle" id="openDot"></span><span id="openValue">0 из 4</span></div>
    </div>
    <div class="stat">
      <div class="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Браузер</div>
      <div class="v" id="browserValue">—</div>
    </div>
  </section>

  <div class="sites-head">
    <div class="sec-head"><h2 tabindex="0" data-tip="У каждого сайта отдельный профиль браузера: куки, кеш и сессии не пересекаются">Сайты</h2><div class="line"></div>
      <button class="edit-toggle" id="editList" title="Редактировать названия, адреса и состав списка">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L18 10a2.8 2.8 0 0 0-4-4L4 16v4Z"/><path d="m13.5 6.5 4 4"/></svg>
        <span>Изменить</span>
      </button>
    </div>

    <div class="edit-bar" id="editBar" aria-hidden="true">
      <button class="edit-btn add" id="addSite">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        Добавить сайт
      </button>
      <div class="spacer"></div>
      <button class="edit-btn cancel" id="cancelEdit">Отмена</button>
      <button class="edit-btn save" id="saveEdit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>
        Сохранить
      </button>
    </div>
  </div>

  <div class="sites" id="sites"></div>
</div>

<div class="toast" id="toast"></div>

<script>
  const savedTheme = localStorage.getItem('synapse-theme');
  if (savedTheme) document.documentElement.dataset.theme = savedTheme;

  const T = window.__TAURI__;
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  const LOGOS = {
    gemini: `<svg viewBox="0 0 24 24"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#4c8dff"/><stop offset=".55" stop-color="#9b72cb"/><stop offset="1" stop-color="#d96570"/>
      </linearGradient></defs><path fill="url(#g1)" d="M12 2.2c.5 2.9 1.7 5.1 3.6 6.6 1.5 1.2 3.3 1.9 6.2 2.2-2.9.4-5.1 1.5-6.6 3.4-1.2 1.5-1.9 3.4-2.2 6.4-.4-3-1.6-5.2-3.4-6.7-1.5-1.2-3.4-1.9-6.4-2.1 3-.5 5.2-1.6 6.7-3.5 1.2-1.4 1.9-3.2 2.1-6.3Z"/></svg>`,
    chatgpt: `<svg viewBox="0 0 24 24" fill="none" stroke="#10a37f" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3.2a3.6 3.6 0 0 1 3.4 2.4 3.6 3.6 0 0 1 2.9 5.9 3.6 3.6 0 0 1-2.1 5.7 3.6 3.6 0 0 1-5.1 2.3 3.6 3.6 0 0 1-4.3-.4 3.6 3.6 0 0 1-2.3-5.1 3.6 3.6 0 0 1 .6-4.3 3.6 3.6 0 0 1 5-2.3A3.6 3.6 0 0 1 12 3.2Z"/><path d="M12 7.4v9.2M8.1 9.6l7.8 4.6M15.9 9.6l-7.8 4.6"/></svg>`,
    claude: `<svg viewBox="0 0 24 24" stroke="#d97757" stroke-width="2" stroke-linecap="round" fill="none"><g transform="translate(12 12)"><path d="M0-8V-4M0 4v4M-8 0h4M4 0h4M-5.7-5.7l2.8 2.8M2.9 2.9l2.8 2.8M5.7-5.7 2.9-2.9M-2.9 2.9l-2.8 2.8"/></g></svg>`,
    grok: `<svg viewBox="0 0 24 24" fill="none"><path d="M4 20 20 4" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/><path d="M13.2 4h6.8v6.8" stroke="#8a97a9" stroke-width="2.2" stroke-linecap="round"/><path d="M4 4h4.6" stroke="#8a97a9" stroke-width="2.2" stroke-linecap="round"/></svg>`
  };
  const TINTS = {
    gemini: 'rgba(66,133,244,.35)',
    chatgpt: 'rgba(16,163,127,.35)',
    claude: 'rgba(217,119,87,.35)',
    grok: 'rgba(140,150,170,.3)'
  };

  let state = null;

  function toast(msg, kind) {
    const t = $('toast');
    t.textContent = msg;
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => { t.className = 'toast'; }, 2200);
  }

  function card(site, running) {
    const isOpen = running.includes(site.id);
    const vpn = !!(state.config && state.config.tunnel && state.config.tunnel.enabled);
    const host = site.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
    const route = vpn
      ? (site.direct ? 'напрямую' : 'через VPN')
      : (site.direct ? 'без DoH' : '');
    const globeTitle = vpn
      ? (site.direct ? 'Вернуть сайт в VPN' : 'Пустить сайт напрямую, мимо VPN')
      : (site.direct ? 'Вернуть DoH для этого сайта' : 'Обходить DoH (системный DNS) для этого сайта');
    const health = (state.health || {})[site.id];
    const hs = health ? (health.ok ? 'ok' : 'bad') : 'unknown';
    const hsTitle = health
      ? `${health.ok ? 'Доступен' : 'Недоступен'}: ${health.detail} (${health.checked})`
      : 'Проверка ещё не выполнялась';
    return `<div class="card" data-id="${esc(site.id)}" style="--tint:${TINTS[site.id] || 'rgba(76,141,255,.3)'}">
      <div class="drag-handle" data-handle title="Перетащите, чтобы изменить порядок">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
      </div>
      <div class="tile">${LOGOS[site.id] || LOGOS.gemini}</div>
      <div class="body">
        <div class="name"><span class="hs ${hs}" title="${esc(hsTitle)}"></span>${esc(site.name)}</div>
        <div class="host"><b>${esc(host)}</b>${route ? ' · ' + route : ''}${site.enabled ? '' : ' · выключен'}</div>
      </div>
      <div class="actions">
        <button class="btn ${isOpen ? 'open' : ''}" data-open="${esc(site.id)}" ${site.enabled ? '' : 'disabled'}>Открыть</button>
        <button class="globe-btn ${site.direct ? 'active' : ''}" data-direct="${esc(site.id)}" title="${globeTitle}">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/>
          </svg>
        </button>
        <button class="pin-btn ${site.pinned ? 'active' : ''}" data-pin="${esc(site.id)}" title="${site.pinned ? 'Снять закрепление поверх окон' : 'Закрепить поверх всех окон'}">
          <svg viewBox="0 0 24 24" fill="${site.pinned ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 3h6l-1 6 3.5 3.5H6.5L10 9 9 3Z"/><path d="M12 12.5V21"/>
          </svg>
        </button>
      </div>
    </div>`;
  }

  let lastSig = '';
  let editing = false;
  let draftSites = [];
  let removedSiteIds = new Set();

  function makeSiteId(url, name) {
    let base = '';
    try { base = new URL(url).hostname.replace(/^www\./, '').split('.')[0]; } catch (e) { /* ignore */ }
    base = (base || name || 'site').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'site';
    let id = base;
    let n = 2;
    while (draftSites.some(s => s.id === id) || removedSiteIds.has(id)) { id = base + '-' + n++; }
    return id;
  }

  function cardEdit(site) {
    return `<div class="card editing-card" data-id="${esc(site.id)}" style="--tint:${TINTS[site.id] || 'rgba(76,141,255,.3)'}">
      <div class="drag-handle" data-handle title="Перетащите, чтобы изменить порядок">
        <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="9" cy="6" r="1.6"/><circle cx="15" cy="6" r="1.6"/><circle cx="9" cy="12" r="1.6"/><circle cx="15" cy="12" r="1.6"/><circle cx="9" cy="18" r="1.6"/><circle cx="15" cy="18" r="1.6"/></svg>
      </div>
      <div class="tile">${LOGOS[site.id] || LOGOS.gemini}</div>
      <div class="edit-fields">
        <input class="edit-name" data-field="name" value="${esc(site.name)}" placeholder="Название">
        <input class="edit-url" data-field="url" value="${esc(site.url)}" placeholder="https://example.com">
      </div>
      <button class="delete-btn" data-delete="${esc(site.id)}" title="Удалить сайт">×</button>
    </div>`;
  }

  function renderEditSites() {
    $('sites').innerHTML = draftSites.map(cardEdit).join('');
    updateStats();
  }

  function syncDraftOrder() {
    const ids = [...$('sites').children].map(card => card.dataset.id).filter(Boolean);
    const byId = new Map(draftSites.map(site => [site.id, site]));
    draftSites = ids.map(id => byId.get(id)).filter(Boolean);
  }

  function validateDraft() {
    let ok = true;
    const cards = [...$('sites').children];
    draftSites.forEach(site => {
      site.name = String(site.name || '').trim();
      site.url = String(site.url || '').trim();
      const card = cards.find(item => item.dataset.id === site.id);
      if (!card) return;
      const nameEl = card.querySelector('.edit-name');
      const urlEl = card.querySelector('.edit-url');
      const nameOk = !!site.name;
      const urlOk = /^https?:\/\/[^\s]+/i.test(site.url);
      nameEl.classList.toggle('invalid', !nameOk);
      urlEl.classList.toggle('invalid', !urlOk);
      if (!nameOk || !urlOk) ok = false;
    });
    return ok;
  }

  async function saveDraft() {
    if (!T) { toast('Демо-режим: редактирование недоступно', 'err'); return; }
    syncDraftOrder();
    if (!draftSites.length) { toast('Должен остаться хотя бы один сайт', 'err'); return; }
    if (!validateDraft()) { toast('Проверьте названия и адреса сайтов', 'err'); return; }
    const payload = JSON.parse(JSON.stringify(state.config));
    payload.sites = draftSites.map(site => ({
      ...site,
      name: site.name.trim(),
      url: site.url.trim()
    }));
    try {
      state = await T.core.invoke('save_config', { config: payload });
      exitEdit();
      toast('Список сайтов сохранён', 'ok');
      runChecks();
    } catch (err) {
      toast(String(err), 'err');
    }
  }

  function enterEdit() {
    if (!T) { toast('Демо-режим: редактирование недоступно', ''); return; }
    draftSites = JSON.parse(JSON.stringify(state.config.sites || []));
    removedSiteIds = new Set();
    editing = true;
    document.body.classList.add('editing');
    $('editList').hidden = true;
    $('editBar').classList.add('open');
    $('editBar').setAttribute('aria-hidden', 'false');
    setTimeout(() => {
      if (editing) $('editBar').classList.add('ready');
    }, 320);
    lastSig = '';
    renderEditSites();
    const first = $('sites').querySelector('.edit-name');
    if (first) first.focus();
  }

  function exitEdit() {
    editing = false;
    draftSites = [];
    document.body.classList.remove('editing');
    $('editList').hidden = false;
    $('editBar').classList.remove('open');
    $('editBar').classList.remove('ready');
    $('editBar').setAttribute('aria-hidden', 'true');
    lastSig = '';
    render(true);
  }

  function addDraftSite() {
    const id = makeSiteId('', '');
    draftSites.push({
      id,
      name: '',
      url: '',
      pinned: false,
      enabled: true,
      direct: false,
      window: ''
    });
    renderEditSites();
    const rows = $('sites').children;
    const last = rows[rows.length - 1];
    if (last) last.querySelector('.edit-name').focus();
  }

  function updateStats() {
    const cfg = state.config;
    const running = state.running || [];
    const sites = editing ? draftSites : (cfg.sites || []);
    const proxy = state.proxy || { port: cfg.proxy_port, running: false };
    $('openValue').textContent = running.length + ' из ' + sites.length;
    $('openDot').className = 'dot ' + (running.length ? '' : 'idle');
    $('browserValue').textContent = state.browser && state.browser.found ? state.browser.name : 'Не найден';
    const doh = (cfg.doh && cfg.doh.url || '').trim();
    const vpn = !!(cfg.tunnel && cfg.tunnel.enabled);
    $('dohValue').textContent = vpn ? 'VPN' : (doh || 'Не выбран');
    $('dohDot').className = 'dot ' + ((vpn || doh) ? '' : 'warn');
    $('dohValue').title = vpn
      ? 'VPN: обычные сайты идут через туннель, DoH отключён'
      : (doh ? 'DoH: DNS-запросы идут через ' + doh : 'DoH не задан — используется системный DNS');
    $('proxyValue').textContent = '127.0.0.1:' + proxy.port;
    $('proxyDot').className = 'dot ' + (proxy.running ? '' : 'idle');
    $('proxyValue').title = proxy.running
      ? (vpn
          ? 'Прокси работает, трафик сайтов идёт через VPN'
          : 'Прокси работает, DNS-запросы идут через ' + (doh || 'системный DNS'))
      : 'Прокси не запустился';
  }

  function render(force = false) {
    const cfg = state.config;
    const running = state.running || [];
    const sites = editing ? draftSites : (cfg.sites || []);
    const proxy = state.proxy || { port: cfg.proxy_port, running: false };
    const sig = JSON.stringify({
      sites,
      running,
      health: state.health || {},
      browser: state.browser,
      proxy,
      doh: (cfg.doh && cfg.doh.url) || '',
      tunnel: cfg.tunnel || null
    });
    if (!force && sig === lastSig) { updateStats(); return; }
    lastSig = sig;
    if (!editing) $('sites').innerHTML = sites.map(s => card(s, running)).join('');
    updateStats();
  }

  function bindSiteActions() {
    $('sites').addEventListener('click', async (event) => {
      const openBtn = event.target.closest('[data-open]');
      if (openBtn) {
        openSite(openBtn.dataset.open);
        return;
      }
      const directBtn = event.target.closest('[data-direct]');
      if (directBtn) {
        if (!T) { toast('Демо-режим: обход DoH недоступен'); return; }
        try {
          const direct = await T.core.invoke('toggle_direct', { id: directBtn.dataset.direct });
          const vpn = !!(state.config && state.config.tunnel && state.config.tunnel.enabled);
          toast(
            vpn
              ? (direct ? 'Сайт идёт напрямую, мимо VPN' : 'Сайт снова через VPN')
              : (direct ? 'Сайт идёт через системный DNS' : 'Сайт снова через DoH'),
            'ok'
          );
          await refresh();
          runChecks();
        } catch (e) { toast(String(e), 'err'); }
        return;
      }
      const pinBtn = event.target.closest('[data-pin]');
      if (pinBtn) {
        if (!T) { toast('Демо-режим: закрепление недоступно'); return; }
        try {
          const pinned = await T.core.invoke('toggle_pin', { id: pinBtn.dataset.pin });
          toast(pinned ? 'Закреплено поверх всех окон' : 'Закрепление снято', 'ok');
          await refresh();
        } catch (e) { toast(String(e), 'err'); }
      }
    });
  }

  function animateReorder(container, before) {
    for (const card of container.children) {
      const prev = before.get(card);
      if (!prev) continue;
      const now = card.getBoundingClientRect();
      const dx = prev.left - now.left;
      const dy = prev.top - now.top;
      if (dx || dy) {
        card.animate(
          [{ transform: `translate(${dx}px, ${dy}px)` }, { transform: 'none' }],
          { duration: 200, easing: 'cubic-bezier(.2,.8,.2,1)' }
        );
      }
    }
  }

  function enableDrag(container) {
    let card = null;

    container.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      const handle = e.target.closest('[data-handle]');
      if (!handle || !document.body.classList.contains('editing')) return;
      const target = handle.closest('.card');
      if (!target) return;
      e.preventDefault();
      card = target;
      card.classList.add('dragging');
      card.style.pointerEvents = 'none';
      document.body.classList.add('dragging-active');
      try { container.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
    });

    const finish = async () => {
      if (!card) return;
      card.classList.remove('dragging');
      card.style.pointerEvents = '';
      document.body.classList.remove('dragging-active');
      card = null;
      if (!T) return;
      if (editing) { syncDraftOrder(); return; }
      const ids = [...container.children].map(c => c.dataset.id).filter(Boolean);
      try {
        await T.core.invoke('reorder_sites', { ids });
        await refresh(true);
      } catch (err) {
        toast(String(err), 'err');
      }
    };

    container.addEventListener('pointermove', (e) => {
      if (!card) return;
      const el = document.elementFromPoint(e.clientX, e.clientY);
      const target = el && el.closest ? el.closest('.card') : null;
      if (!target || target === card || target.parentElement !== container) return;
      const before = new Map([...container.children].map(c => [c, c.getBoundingClientRect()]));
      const rect = target.getBoundingClientRect();
      const insertBefore = (e.clientY - rect.top) < rect.height / 2;
      container.insertBefore(card, insertBefore ? target : target.nextSibling);
      animateReorder(container, before);
    });

    container.addEventListener('pointerup', finish);
    container.addEventListener('pointercancel', finish);
  }

  function showUpdate(info) {
    if (!info || !info.available) return;
    $('updateVersion').textContent = info.latest;
    $('updateNote').textContent = `Установлена ${info.current}`;
    $('updateNotesLink').hidden = !info.url;
    $('updateNotesLink').onclick = (event) => {
      event.preventDefault();
      openRelease(info.url);
    };
    const canSelfUpdate = !!info.can_self_update;
    $('updateNow').textContent = canSelfUpdate ? 'Обновить' : 'Скачать';
    $('updateNow').onclick = canSelfUpdate
      ? () => startUpdate(info.mode)
      : () => openRelease(info.url);
    $('updateHide').onclick = () => {
      $('update').hidden = true;
    };
    $('update').hidden = false;
  }

  async function startUpdate(mode) {
    if (!T) return;
    const btn = $('updateNow');
    const link = $('updateNotesLink');
    const hide = $('updateHide');
    btn.disabled = true;
    hide.disabled = true;
    link.style.pointerEvents = 'none';
    btn.textContent = 'Скачивание…';
    $('updateNote').textContent = 'Скачивание и проверка обновления';
    try {
      const result = await T.core.invoke('apply_update');
      if (result && result.action === 'downloaded') {
        const hint = mode === 'portable'
          ? 'Распакуйте архив и замените Synapse.exe и xray.exe.'
          : 'Запустите скачанный установщик.';
        btn.textContent = 'Скачано';
        $('updateNote').textContent = `Сохранено в «Загрузки»: ${result.file}. ${hint}`;
        hide.disabled = false;
        link.style.pointerEvents = '';
        toast('Обновление скачано в «Загрузки»', 'ok');
        return;
      }
      btn.textContent = 'Установка…';
      $('updateNote').textContent = 'Установка, приложение перезапустится';
    } catch (e) {
      btn.disabled = false;
      hide.disabled = false;
      link.style.pointerEvents = '';
      btn.textContent = 'Обновить';
      $('updateNote').textContent = String(e);
    }
  }

  async function openRelease(url) {
    if (!url) { toast('Ссылка на релиз недоступна', 'err'); return; }
    if (!T) { window.open(url, '_blank'); return; }
    try { await T.core.invoke('open_release', { url }); }
    catch (e) { toast(String(e), 'err'); }
  }

  async function checkUpdate() {
    if (!T) return;
    try {
      const info = await T.core.invoke('check_update');
      if (info) showUpdate(info);
    } catch (e) { /* тихо: нет сети или GitHub недоступен */ }
  }

  async function openSite(id) {
    if (!T) { toast('Демо-режим: запуск недоступен', ''); return; }
    try {
      await T.core.invoke('open_site', { id });
      toast('Окно открывается', 'ok');
    } catch (e) {
      toast(String(e), 'err');
    }
    setTimeout(() => refresh().catch(() => {}), 1500);
  }

  async function refresh(force = false) {
    if (!T) return;
    state = await T.core.invoke('get_state');
    render(force);
  }

  async function refresh() {
    if (!T) return;
    state = await T.core.invoke('get_state');
    render();
  }

  async function runChecks() {
    if (!T) return;
    try {
      await T.core.invoke('check_sites');
      state = await T.core.invoke('get_state');
      render();
    } catch (e) { /* тихо: проверка не критична */ }
  }

  const DEMO = {
    config: {
      proxy_port: 8877,
      doh: { url: '' },
      sites: [
        { id: 'gemini', name: 'Gemini', url: 'https://gemini.google.com', pinned: true, enabled: true },
        { id: 'chatgpt', name: 'ChatGPT', url: 'https://chatgpt.com', pinned: false, enabled: true },
        { id: 'claude', name: 'Claude', url: 'https://claude.ai', pinned: false, enabled: true },
        { id: 'grok', name: 'Grok', url: 'https://grok.com', pinned: false, enabled: false }
      ]
    },
    running: ['gemini'],
    browser: { name: 'Google Chrome', found: true },
    proxy: { port: 8877, running: true }
  };

  (async () => {
    if (T) {
      try { state = await T.core.invoke('get_state'); } catch (e) { toast(String(e), 'err'); }
    }
    if (!state) state = DEMO;
    bindSiteActions();
    enableDrag($('sites'));
    $('editList').addEventListener('click', enterEdit);
    $('addSite').addEventListener('click', addDraftSite);
    $('cancelEdit').addEventListener('click', exitEdit);
    $('saveEdit').addEventListener('click', saveDraft);
    $('sites').addEventListener('input', (event) => {
      if (!editing) return;
      const input = event.target.closest('.edit-name, .edit-url');
      const card = input && input.closest('.editing-card');
      if (!input || !card) return;
      const site = draftSites.find(item => item.id === card.dataset.id);
      if (!site) return;
      if (input.classList.contains('edit-name')) site.name = input.value;
      if (input.classList.contains('edit-url')) site.url = input.value;
      input.classList.remove('invalid');
    });
    $('sites').addEventListener('click', (event) => {
      const remove = event.target.closest('[data-delete]');
      if (!remove || !editing) return;
      if (draftSites.length <= 1) {
        toast('Должен остаться хотя бы один сайт', 'err');
        return;
      }
      const site = draftSites.find(item => item.id === remove.dataset.delete);
      if (!site) return;
      if (!confirm(`Удалить «${site.name || 'сайт'}»? Профиль браузера останется на диске.`)) return;
      removedSiteIds.add(site.id);
      draftSites = draftSites.filter(item => item.id !== site.id);
      renderEditSites();
    });
    render();
    if (T) setTimeout(checkUpdate, 900);
    $('refresh').addEventListener('click', () => {
      refresh().then(() => { runChecks(); toast('Обновлено'); });
    });
    if (T) {
      setInterval(() => { if (document.visibilityState === 'visible') refresh().catch(() => {}); }, 1500);
      setInterval(() => { if (document.visibilityState === 'visible') runChecks(); }, 60000);
      window.addEventListener('focus', () => { refresh().catch(() => {}); });
      setTimeout(runChecks, 1200);
    }
  })();
</script>
