[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-doh"
version = "1.0.1"
description = "Windows desktop AI hub for Gemini, ChatGPT, Claude and Grok behind a local DNS-over-HTTPS proxy"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Synapse contributors" }]
keywords = ["doh", "dns-over-https", "gemini", "chatgpt", "claude", "grok", "proxy"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Name Service (DNS)",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = []

[project.optional-dependencies]
build = ["pyinstaller>=6.11,<7"]

[project.gui-scripts]
synapse = "synapse.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
synapse = ["assets/*.ico", "assets/*.png"]
