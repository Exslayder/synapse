name: Refresh latest release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Fetch Xray core
        shell: pwsh
        run: ./.github/scripts/fetch-xray.ps1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri build

      - name: Collect release files
        shell: pwsh
        run: |
          $root = $PWD
          New-Item -ItemType Directory -Force dist-out | Out-Null
          New-Item -ItemType Directory -Force portable-stage | Out-Null
          Copy-Item src-tauri/target/release/synapse.exe portable-stage/Synapse.exe
          Copy-Item src-tauri/target/release/xray.exe portable-stage/xray.exe
          Copy-Item src-tauri/resources/xray-LICENSE.txt portable-stage/xray-LICENSE.txt
          Copy-Item docs/PORTABLE-README.txt portable-stage/README-PORTABLE.txt
          Push-Location portable-stage
          Compress-Archive -Path Synapse.exe,xray.exe,README-PORTABLE.txt,xray-LICENSE.txt -DestinationPath (Join-Path $root 'dist-out\Synapse_portable.zip') -Force
          Pop-Location
          Remove-Item portable-stage -Recurse -Force
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-out/

      - name: Replace files in the latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $tag = gh release list --limit 1 --json tagName --jq '.[0].tagName'
          if (-not $tag) {
            Write-Error "No release found"
            exit 1
          }
          if ($tag.TrimStart('v') -ne $version) {
            Write-Error "Main version $version does not match latest release $tag; create a new release instead"
            exit 1
          }
          Write-Host "Updating release $tag"
          gh release upload $tag dist-out/* --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
