name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri build

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-out | Out-Null
          Copy-Item src-tauri/target/release/synapse.exe dist-out/Synapse.exe
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-out/
          Get-ChildItem dist-out

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Synapse ${{ github.ref_name }}
          generate_release_notes: true
          files: dist-out/*
