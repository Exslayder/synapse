name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Fetch Xray core
        shell: pwsh
        run: ./.github/scripts/fetch-xray.ps1

      - name: Install frontend dependencies
        run: npm ci

      - name: Build application
        run: npm run tauri build

      - name: Collect release files
        shell: pwsh
        run: |
          $root = $PWD
          New-Item -ItemType Directory -Force dist-out | Out-Null
          New-Item -ItemType Directory -Force portable-stage | Out-Null
          Copy-Item src-tauri/target/release/synapse.exe portable-stage/Synapse.exe
          Copy-Item src-tauri/target/release/xray.exe portable-stage/xray.exe
          Copy-Item src-tauri/resources/xray-LICENSE.txt portable-stage/xray-LICENSE.txt
          Copy-Item docs/PORTABLE-README.txt portable-stage/README-PORTABLE.txt
          Push-Location portable-stage
          Compress-Archive -Path Synapse.exe,xray.exe,README-PORTABLE.txt,xray-LICENSE.txt -DestinationPath (Join-Path $root 'dist-out\Synapse_portable.zip') -Force
          Pop-Location
          Remove-Item portable-stage -Recurse -Force
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe dist-out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi dist-out/
          # отдельный exe нужен портативным сборкам 2.0.5 и старше для самообновления
          Copy-Item src-tauri/target/release/synapse.exe dist-out/synapse.exe
          Get-ChildItem dist-out

      - name: Build release notes
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = '(?ms)^##\s+' + [regex]::Escape($version) + '\b.*?(?=^##\s|\z)'
          $section = [regex]::Match($changelog, $pattern).Value.Trim()

          $previous = git describe --tags --abbrev=0 "$tag^" 2>$null
          if ($LASTEXITCODE -ne 0) { $previous = '' }

          $notes = @()
          if ($section) {
            $break = $section.IndexOf("`n")
            if ($break -ge 0) { $notes += $section.Substring($break + 1).Trim() }
          } else {
            Write-Host "CHANGELOG has no section for $version, using commits"
            $range = if ($previous) { "$previous..$tag" } else { $tag }
            $notes += (git log $range --no-merges --pretty=format:'- %s')
          }
          if ($previous) {
            $notes += ''
            $notes += "**Полный список изменений:** https://github.com/Exslayder/synapse/compare/$previous...$tag"
          }

          $body = ($notes -join "`n").Trim()
          if (-not $body) { $body = "Synapse $version" }
          [IO.File]::WriteAllText("$PWD\RELEASE_NOTES.md", $body, (New-Object Text.UTF8Encoding($false)))
          Write-Host "--- release notes ---"
          Get-Content RELEASE_NOTES.md -Encoding UTF8

      - name: Publish release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: Synapse ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          files: dist-out/*
