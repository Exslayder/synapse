name: Weekly dependency update

on:
  schedule:
    # Every Monday at 03:00 UTC
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    permissions:
      contents: write
      pull-requests: write
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri

      - name: Update npm dependencies
        run: npm update --save

      - name: Update cargo dependencies
        run: cargo update --manifest-path src-tauri/Cargo.toml

      - name: Fetch Xray core
        shell: pwsh
        run: ./.github/scripts/fetch-xray.ps1

      - name: Install frontend dependencies
        run: npm ci

      - name: Rebuild application
        run: npm run tauri build

      - name: Open dependency update pull request
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Dependencies already up to date"
            exit 0
          }

          git checkout -B chore/weekly-deps
          git commit -m "chore: weekly dependency update"
          git push --force origin chore/weekly-deps
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $existing = gh pr list --head chore/weekly-deps --state open --json number --jq '.[0].number'
          if ($existing) {
            Write-Host "Updated existing pull request #$existing"
          } else {
            gh pr create `
              --base main `
              --head chore/weekly-deps `
              --title "chore: weekly dependency update" `
              --body "Автоматическое обновление npm- и cargo-зависимостей. Сборка проверена в этом workflow; перед merge просмотрите diff lock-файлов."
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
